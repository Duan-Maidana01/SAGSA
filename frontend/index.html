
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar — SAGSA</title>

    <meta name="description" content="Acesse o SAGSA, Sistema de Gestão de Situações de Aprendizagem.">

    <link rel="stylesheet" href="./css/style.css">

    <script type="module" src="./js/login.js"></script>
</head>

<body>

    <main class="login-container">

        <h1>Entrar</h1>

        <p class="subtitulo">
            Acesse sua conta para continuar.
        </p>

        <form id="formLogin" novalidate>

            <label for="email">E-mail</label>

            <input
                type="email"
                id="email"
                placeholder="voce@escola.com"
                autocomplete="email"
            >

            <label for="senha">Senha</label>

            <div class="senha-container">

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                >

                <button type="button" id="mostrarSenha">
                    Mostrar
                </button>

            </div>

            <p id="mensagemErro" role="alert"></p>

            <button type="submit" id="btnEntrar">
                Entrar
            </button>

        </form>

        <p class="informacao">
            As contas são criadas pelo administrador em Administração → Usuários.
        </p>

    </main>

</body>

</html>
